<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant support : application fil rouge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --marine: #161A2E;
    --marine-clair: #232848;
    --carte: #EDEAE2;
    --carte-ombre: #E1DCCF;
    --peche: #F5A768;
    --peche-sombre: #E0894A;
    --texte: #1C2033;
    --texte-doux: #8B93B0;
    --bord: #D8D2C2;
    --erreur: #E85D5D;
    --erreur-fond: #3A2430;
    --vert: #7DC98F;
  }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font: 15px/1.55 "Inter", sans-serif;
    color: var(--texte);
    background: var(--marine);
    background-image:
      radial-gradient(circle at 12% -10%, rgba(245,167,104,.16), transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(255,255,255,.05), transparent 40%);
  }

  h1, h2, h3, label, nav button, button.envoyer {
    font-family: "Fredoka", "Inter", sans-serif;
  }

  header {
    padding: 34px 24px 18px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 600;
    color: #fff;
    letter-spacing: .01em;
  }
  header p {
    margin: 8px auto 0;
    max-width: 480px;
    font-size: 13.5px;
    color: var(--texte-doux);
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 8px 16px 60px;
  }

  nav {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 22px;
  }
  nav button {
    border: none;
    background: var(--marine-clair);
    color: var(--texte-doux);
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: background .15s ease, color .15s ease;
  }
  nav button[aria-selected="true"] {
    background: var(--peche);
    color: var(--marine);
    font-weight: 600;
  }
  nav button:not([aria-selected="true"]):hover {
    background: #2C3258;
  }

  section[hidden] { display: none; }

  .panneau {
    background: var(--carte);
    border-radius: 26px;
    padding: 26px 26px 22px;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,.5);
  }

  label {
    display: block;
    font-weight: 600;
    font-size: 13.5px;
    color: var(--texte);
    margin-bottom: 8px;
  }

  textarea, input[type=text], select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--bord);
    border-radius: 14px;
    font: 14.5px "Inter", sans-serif;
    background: #fff;
    color: var(--texte);
  }
  textarea { min-height: 130px; resize: vertical; }
  textarea:focus, input[type=text]:focus, select:focus {
    outline: none;
    border-color: var(--peche);
    box-shadow: 0 0 0 3px rgba(245,167,104,.25);
  }

  .ligne {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    margin-top: 16px;
  }
  .ligne > div { flex: 0 0 170px; }

  button.envoyer {
    background: var(--peche);
    color: var(--marine);
    border: 0;
    padding: 12px 24px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-left: auto;
    transition: background .15s ease, transform .1s ease;
  }
  button.envoyer:hover:not(:disabled) { background: var(--peche-sombre); }
  button.envoyer:active:not(:disabled) { transform: scale(.97); }
  button.envoyer:disabled {
    background: var(--carte-ombre);
    color: var(--texte-doux);
    cursor: not-allowed;
  }

  .sortie {
    margin-top: 20px;
    border-top: 1.5px dashed var(--bord);
    padding-top: 18px;
    min-height: 50px;
    white-space: pre-wrap;
    font-size: 15px;
  }
  .attente { color: var(--texte-doux); font-style: italic; }
  .curseur::after {
    content: "▌";
    color: var(--peche-sombre);
    animation: clignote 1s steps(2) infinite;
  }
  @keyframes clignote { 50% { opacity: 0; } }

  .erreur {
    background: var(--erreur-fond);
    border: 1.5px solid var(--erreur);
    color: #FFD9D9;
    padding: 13px 16px;
    border-radius: 14px;
    font-size: 14px;
  }

  .usage {
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--texte-doux);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .usage span {
    background: #fff;
    border: 1px solid var(--bord);
    border-radius: 999px;
    padding: 5px 12px;
  }
  .usage b { color: var(--peche-sombre); font-weight: 600; }

  .sources { margin-top: 16px; }
  .sources h3 {
    font-size: 12px;
    color: var(--texte-doux);
    font-weight: 500;
    margin: 0 0 10px;
  }
  .source {
    display: inline-block;
    background: #fff;
    border: 1.5px solid var(--bord);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12.5px;
    margin: 0 6px 6px 0;
    color: var(--texte);
  }
  .source span { color: var(--peche-sombre); font-weight: 600; }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--texte-doux);
    padding: 10px 16px 30px;
  }
  code {
    background: var(--marine-clair);
    color: var(--peche);
    padding: 2px 7px;
    border-radius: 6px;
    font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <h1>Assistant support</h1>
  <p>Application fil rouge : ce front est fourni. Gardez-le, modifiez-le ou remplacez-le.</p>
</header>

<main>
  <nav role="tablist">
    <button role="tab" data-onglet="resumer" aria-selected="true">Résumer · S9</button>
    <button role="tab" data-onglet="assistant" aria-selected="false">Assistant · S10</button>
    <button role="tab" data-onglet="documents" aria-selected="false">Documents · S13</button>
  </nav>

  <section id="panneau-resumer" class="panneau">
    <label for="texte">Texte du ticket à résumer</label>
    <textarea id="texte" placeholder="Collez ici le message d'un client."></textarea>
    <div class="ligne">
      <div>
        <label for="ton">Ton du résumé</label>
        <select id="ton">
          <option value="neutre">neutre</option>
          <option value="direct">direct</option>
        </select>
      </div>
      <button class="envoyer" data-route="/api/resumer">Résumer</button>
    </div>
    <div class="sortie" id="sortie-resumer"></div>
    <div class="usage" id="usage-resumer"></div>
  </section>

  <section id="panneau-assistant" class="panneau" hidden>
    <label for="question-assistant">Question sur une commande</label>
    <input type="text" id="question-assistant"
           placeholder="Où en est la commande CMD-2024-118 ?">
    <div class="ligne">
      <button class="envoyer" data-route="/api/assistant">Demander</button>
    </div>
    <div class="sortie" id="sortie-assistant"></div>
    <div class="usage" id="usage-assistant"></div>
  </section>

  <section id="panneau-documents" class="panneau" hidden>
    <label for="question-documents">Question sur la documentation</label>
    <input type="text" id="question-documents"
           placeholder="Comment demander un remboursement ?">
    <div class="ligne">
      <button class="envoyer" data-route="/api/documents">Chercher</button>
    </div>
    <div class="sources" id="sources-documents"></div>
    <div class="sortie" id="sortie-documents"></div>
    <div class="usage" id="usage-documents"></div>
  </section>
</main>

<footer>
  Les Fondamentaux de l'IA · 3IW · ESGI
  — contrat de route : <code>app/CONTRAT.md</code>
</footer>

<script>
// Ce fichier est fourni. Vous pouvez le garder, le modifier ou le remplacer,
// a une condition : n'appeler QUE les routes de votre serveur, jamais le modele.

const ONGLETS = ["resumer", "assistant", "documents"];

document.querySelectorAll('nav button').forEach((bouton) => {
  bouton.addEventListener('click', () => {
    ONGLETS.forEach((nom) => {
      const actif = nom === bouton.dataset.onglet;
      document.getElementById('panneau-' + nom).hidden = !actif;
      document.querySelector(`nav button[data-onglet="${nom}"]`)
        .setAttribute('aria-selected', String(actif));
    });
  });
});

function corpsDeLaRequete(route) {
  if (route === '/api/resumer') {
    return {
      texte: document.getElementById('texte').value,
      ton: document.getElementById('ton').value,
    };
  }
  const cle = route === '/api/assistant' ? 'assistant' : 'documents';
  return { question: document.getElementById('question-' + cle).value };
}

function nomDuPanneau(route) {
  return route.split('/').pop();
}

async function envoyer(bouton) {
  const route = bouton.dataset.route;
  const nom = nomDuPanneau(route);
  const sortie = document.getElementById('sortie-' + nom);
  const usage = document.getElementById('usage-' + nom);
  const sources = document.getElementById('sources-' + nom);

  bouton.disabled = true;
  sortie.className = 'sortie attente';
  sortie.textContent = 'Le modèle réfléchit...';
  usage.textContent = '';
  if (sources) sources.innerHTML = '';

  const debut = performance.now();
  try {
    const reponse = await fetch(route, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corpsDeLaRequete(route)),
    });

    // Une erreur arrive en JSON classique, jamais en SSE : voir le contrat.
    if (!reponse.ok) {
      const details = await reponse.json().catch(() => ({}));
      throw new Error(details.erreur || `Le serveur a répondu ${reponse.status}.`);
    }

    sortie.className = 'sortie curseur';
    sortie.textContent = '';
    let premierFragment = null;

    const lecteur = reponse.body.getReader();
    const decodeur = new TextDecoder();
    let tampon = '';

    for (;;) {
      const { done, value } = await lecteur.read();
      if (done) break;
      tampon += decodeur.decode(value, { stream: true });
      const morceaux = tampon.split('\n\n');
      tampon = morceaux.pop();
      for (const morceau of morceaux) {
        const ligne = morceau.split('\n').find((l) => l.startsWith('data: '));
        if (!ligne) continue;
        const charge = ligne.slice(6).trim();
        if (!charge || charge === '[DONE]') continue;
        const evenement = JSON.parse(charge);

        if (evenement.sources && sources) {
          sources.innerHTML = '<h3>Sources retenues</h3>' + evenement.sources
            .map((s) => `<span class="source">${s.titre}
                         <span>${Number(s.score).toFixed(2)}</span></span>`)
            .join('');
        }
        if (evenement.delta) {
          if (premierFragment === null) premierFragment = performance.now() - debut;
          sortie.textContent += evenement.delta;
        }
        if (evenement.done) {
          const u = evenement.usage || {};
          usage.innerHTML = [
            `<span>entrée <b>${u.entree ?? '?'}</b> tokens</span>`,
            `<span>sortie <b>${u.sortie ?? '?'}</b> tokens</span>`,
            `<span>serveur <b>${u.ms ?? '?'}</b> ms</span>`,
            `<span>premier fragment <b>${premierFragment ? Math.round(premierFragment) : '?'}</b> ms</span>`,
          ].join('');
        }
      }
    }
    sortie.className = 'sortie';
    if (!sortie.textContent.trim()) {
      sortie.className = 'sortie attente';
      sortie.textContent = 'Le serveur a répondu, mais sans aucun fragment.';
    }
  } catch (erreur) {
    sortie.className = 'sortie';
    sortie.innerHTML = '';
    const boite = document.createElement('div');
    boite.className = 'erreur';
    boite.textContent = erreur.message;
    sortie.appendChild(boite);
  } finally {
    bouton.disabled = false;
  }
}

document.querySelectorAll('button.envoyer').forEach((bouton) => {
  bouton.addEventListener('click', () => envoyer(bouton));
});
</script>
</body>
</html>
